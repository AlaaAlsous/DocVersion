<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="google-site-verification"
      content="paK48xpoSaw4r6Smf6hqbBYaezrEF7vt4VZrh2kggW4"
    />
    <title>DocVersion</title>
    <link rel="icon" type="image/png" href="Assets/Favicon.png" />
    <link rel="stylesheet" href="css/styles.css" />
    <script type="module" src="js/index.js" defer></script>
    <script src="js/vendor/signalr.min.js"></script>
    <script src="js/vendor/mammoth.browser.min.js"></script>
    <script src="js/vendor/monaco-loader.js"></script>
  </head>
  <body>
    <div id="topBar">
      <img
        class="typing-svg"
        src="https://readme-typing-svg.demolab.com?font=Fira+Code&weight=600&size=22&duration=1000&pause=5000&vCenter=true&width=132&height=24&lines=DocVersion"
        alt="Typing SVG"
      />
      <div id="sessionControls">
        <div id="currentUser" style="display: none">
          <span id="userAvatar"></span>
          <span id="userName"></span>
        </div>
        <button id="logoutBtn" type="button">
          <svg
            class="logout-icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
            <polyline points="16 17 21 12 16 7" />
            <line x1="21" y1="12" x2="9" y2="12" />
          </svg>
          <span class="logout-text">Log Out</span>
        </button>
      </div>
    </div>

    <section id="quickActions">
      <div class="action-group">
        <input
          id="folderName"
          name="folderName"
          type="text"
          placeholder="Folder name"
          autocomplete="off"
        />
        <button id="createFolderBtn" type="button">Create Folder</button>
      </div>
      <div class="action-group">
        <input
          id="fileNameInput"
          name="fileNameInput"
          type="text"
          placeholder="File name"
          autocomplete="off"
        />
        <button id="createFileBtn" type="button" class="upload-btn">
          Create File
        </button>
      </div>
      <div class="action-group">
        <input
          id="folderInput"
          name="folderInput"
          type="file"
          webkitdirectory
          directory
          multiple
          style="display: none"
        />
        <label id="folderInputLabel" for="folderInput">
          <span id="folderInputName" data-placeholder="Choose folder..."></span>
        </label>
        <button id="uploadFolderBtn" type="button" class="upload-btn">
          Upload Folder
        </button>
      </div>
      <div class="action-group">
        <input
          id="fileInput"
          name="fileInput"
          type="file"
          style="display: none"
        />
        <label id="fileInputLabel" for="fileInput">
          <span id="fileInputName" data-placeholder="Choose file..."></span>
        </label>
        <button id="uploadBtn" type="button" class="upload-btn">
          Upload File
        </button>
      </div>
    </section>

    <div id="binPanel" style="display: none">
      <div class="bin-header">
        <h3>Recycle Bin</h3>
        <button id="binCloseBtn" type="button" class="bin-close-btn">X</button>
      </div>
      <ul id="binItemsList"></ul>
    </div>

    <p id="errorMessage" class="hidden"></p>

    <main id="workspaceLayout">
      <aside id="treePane">
        <section id="explorerPane">
          <div id="explorerHeader">
            <h2>Explorer</h2>
            <div class="explorer-header-actions">
              <button
                id="binBtn"
                type="button"
                class="explorer-bin-btn"
                aria-label="Open bin"
                title="Recycle Bin"
              ></button>
              <button
                id="explorerSearchToggle"
                type="button"
                aria-label="Toggle search"
                title="Search files"
              ></button>
            </div>
          </div>
          <div id="explorerSearchWrap" style="display: none">
            <input
              id="explorerSearchInput"
              type="text"
              placeholder="Search files..."
              autocomplete="off"
            />
          </div>
          <p id="explorerPath">/</p>
          <ul id="file-list"></ul>
        </section>

        <section id="historyPane">
          <div id="file-history-box" style="display: none"></div>
        </section>

        <section id="metadataPane">
          <div id="file-info-box">
            <h3>Metadata</h3>
            <p>Select a file or folder to view metadata.</p>
          </div>
        </section>
      </aside>

      <section id="fileView">
        <div id="file-content-box">
          <div id="file-content-header">
            <div id="file-content-meta">
              <h3 id="fileContentTitle">File Content</h3>
              <span id="fileContentPath" style="display: none"></span>
            </div>
            <div id="file-content-actions">
              <button id="editBtn" style="display: none">Edit</button>
              <button
                id="shareBtn"
                style="display: none"
                class="icon-btn icon-btn-share"
                aria-label="Share file"
                title="Share file"
              ></button>
              <button id="saveBtn" style="display: none">Save</button>
              <button id="cancelBtn" style="display: none">Cancel</button>
            </div>
          </div>
          <pre id="fileContentBody" class="auto-direction">
Select a file to preview its content.</pre
          >
          <textarea
            id="fileContentTextarea"
            class="auto-direction"
            style="display: none"
          ></textarea>
          <div
            id="monacoEditor"
            style="width: 100%; height: 100%; display: none"
          ></div>
        </div>
      </section>
    </main>
    <div id="loginModal">
      <div>
        <h2 id="modalTitle">Sign In</h2>
        <input
          id="modalUserName"
          name="username"
          type="text"
          placeholder="Email"
          maxlength="100"
          autocomplete="username"
        />
        <input
          id="modalPassword"
          name="password"
          type="password"
          placeholder="Password"
          autocomplete="current-password"
        />
        <p id="modalError" class="hidden"></p>
        <button id="modalSubmit">Log In</button>
        <button id="modalModeToggle" type="button">Create Account</button>
      </div>
    </div>
    <div id="spinner-overlay" style="display: none">
      <div class="loading-wave">
        <div class="loading-bar"></div>
        <div class="loading-bar"></div>
        <div class="loading-bar"></div>
        <div class="loading-bar"></div>
      </div>
    </div>
  </body>
</html>
