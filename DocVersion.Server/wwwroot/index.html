<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DocVersion</title>
    <link rel="icon" type="image/png" href="Assets/Favicon.png" />
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="js/index.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/7.0.7/signalr.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.8.0/mammoth.browser.min.js"></script>
  </head>
  <body>
    <div id="topBar">
      <h1>DocVersion</h1>
      <div id="sessionControls">
        <span id="currentUser" style="display: none"></span>
        <button id="logoutBtn" type="button">Log Out</button>
      </div>
    </div>

    <section id="quickActions">
      <div class="action-group">
        <input id="folderName" type="text" placeholder="Folder name" />
        <button id="createFolderBtn">Create Folder</button>
      </div>
      <div class="action-group">
        <input id="fileInput" type="file" />
        <label id="fileInputLabel" for="fileInput"
          ><span id="fileInputName"></span
        ></label>
        <button id="uploadBtn" class="upload-btn">Upload File</button>
      </div>
    </section>

    <p id="errorMessage" style="display: none"></p>

    <main id="workspaceLayout">
      <aside id="treePane">
        <section id="explorerPane">
          <h2>Explorer</h2>
          <p id="explorerPath">/</p>
          <ul id="file-list"></ul>
        </section>

        <section id="historyPane">
          <div id="file-history-box" style="display: none"></div>
        </section>

        <section id="metadataPane">
          <div id="file-info-box">
            <h3>Metadata</h3>
            <p>Select a file or folder to view metadata.</p>
          </div>
        </section>
      </aside>

      <section id="fileView">
        <div id="file-content-box">
          <div id="file-content-header">
            <div id="file-content-meta">
              <h3 id="fileContentTitle">File Content</h3>
              <span id="fileContentPath" style="display: none"></span>
            </div>
            <div id="file-content-actions">
              <button id="editBtn" style="display: none">Edit</button>
              <button id="saveBtn" style="display: none">Save</button>
              <button id="cancelBtn" style="display: none">Cancel</button>
            </div>
          </div>
          <pre id="fileContentBody">Select a file to preview its content.</pre>
          <textarea id="fileContentTextarea" style="display: none"></textarea>
        </div>
      </section>
    </main>
    <div id="loginModal">
      <div>
        <h2>Sign In</h2>
        <input
          id="modalUserName"
          type="text"
          placeholder="Username"
          maxlength="100"
        />
        <input id="modalPassword" type="password" placeholder="Password" />
        <button id="modalSubmit">Log In</button>
        <p id="modalError" style="display: none"></p>
      </div>
    </div>
  </body>
</html>
