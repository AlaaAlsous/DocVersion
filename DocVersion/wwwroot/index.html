<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DocVersion</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="index.js" defer></script>
  </head>
  <body>
    <div id="topBar">
      <h1>My Files</h1>
      <button id="logoutBtn" type="button">Log Out</button>
    </div>
    <ul id="file-list"></ul>
    <div id="loginModal">
      <div>
        <h2>Sign In</h2>
        <input
          id="modalUserName"
          type="text"
          placeholder="Username"
          maxlength="100"
        />
        <input id="modalPassword" type="password" placeholder="Password" />
        <button id="modalSubmit">Log In</button>
        <p id="modalError" style="display: none"></p>
      </div>
    </div>
  </body>
</html>
